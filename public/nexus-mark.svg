<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5EE"/>
      <stop offset="1" stop-color="#E6E1D3"/>
    </linearGradient>
    <radialGradient id="light" cx="0.32" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.32  0 0 0 0 0.26  0 0 0 0.16 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="press" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/>
      <feOffset dy="2.5"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="inner"/>
      <feFlood flood-color="#000000" flood-opacity="0.35"/>
      <feComposite in2="inner" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- Tile: warm paper with a faint lift, per the macOS 824px body grid. -->
  <g filter="url(#lift)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#light)"/>
    <!-- The readiness rule: one hairline the letter stands on. -->
    <rect x="100" y="740" width="824" height="3" fill="#191A1C" opacity="0.14"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#191A1C" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Overprint: a cobalt signal disc, then a high-contrast N in ink laid over it
       with multiply, the way two plates meet in a riso or letterpress print. -->
  <circle cx="684" cy="362" r="116" fill="#2E44B5" opacity="0.86"/>
  <g filter="url(#press)" style="mix-blend-mode:multiply">
    <path fill="#1B1C1F" d="M300 282 H322 V742 H300 Z"/>
    <path fill="#1B1C1F" d="M300 282 H404 L728 742 H624 Z"/>
    <path fill="#1B1C1F" d="M706 282 H728 V742 H706 Z"/>
    <path fill="#1B1C1F" d="M256 282 H404 V292 H256 Z"/>
    <path fill="#1B1C1F" d="M660 282 H774 V292 H660 Z"/>
    <path fill="#1B1C1F" d="M254 732 H368 V742 H254 Z"/>
  </g>
  <!-- Paper grain over both plates, so ink and cobalt share one surface. -->
  <g clip-path="url(#tile)"><rect x="100" y="100" width="824" height="824" fill="#fff" filter="url(#grain)"/></g>
</svg>
