[package]
name = "project-nexus"
version = "0.1.0"
description = "Project Nexus Phase 1 fixture shell"
edition = "2021"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
